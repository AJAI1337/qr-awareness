<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A5 giveaway posters</title><style>
*{box-sizing:border-box}body{margin:0;background:#d5dddb;font-family:Arial,sans-serif}.tools{padding:20px;text-align:center}button{padding:12px 24px;cursor:pointer}.sheet{width:148mm;height:210mm;margin:20px auto;background:#071412;color:white;position:relative;overflow:hidden;padding:12mm;text-align:center;break-after:page}.sheet:before{content:'';position:absolute;inset:-100px 0 auto;height:240px;border-bottom:35px solid #28e0be;transform:skewY(-15deg);opacity:.14}.kicker{color:#28e0be;font-size:10px;font-weight:bold;letter-spacing:3px}h1{font-size:37px;font-weight:900;line-height:1.05;margin:18px 0 8px;position:relative}h1 span{color:#28e0be}.shirt{height:58mm;width:100%;object-fit:contain}.qr{width:38mm;height:38mm;display:block;margin:0 auto;background:white}.cta{font-size:15px;font-weight:bold;margin:10px 0 6px}.fine{font-size:8px;line-height:1.5;opacity:.75}.location{position:absolute;bottom:6mm;right:8mm;font-size:7px;opacity:.5}@page{size:A5;margin:0}@media print{body{background:white}.tools{display:none}.sheet{margin:0;print-color-adjust:exact;-webkit-print-color-adjust:exact}}@media screen and (max-width:590px){.sheet{zoom:.65}}</style></head><body><div class="tools"><p>Three A5 posters, each with a different location code. Print at actual size with background graphics enabled.</p><button onclick="window.print()">PRINT A5 POSTERS</button><p>Illustration is a concept; confirm the actual prize design and size before printing.</p></div><script>for(const source of ['entrance','registration','seating']){const p=document.createElement('article');p.className='sheet';p.innerHTML=`<div class="kicker">ONE SHIRT. ONE LUCKY FAN.</div><h1>FREE MERCEDES<br><span>F1 T-SHIRT</span><br>UP FOR GRABS</h1><img class="shirt" src="shirt.svg" alt="Racing T-shirt illustration"><img class="qr" src="qr-${source}.svg" alt="QR link to giveaway entry"><p class="cta">SCAN. ENTER. YOU COULD WIN.</p><p class="fine">No purchase necessary. Keep your claim code.<br>Draw details announced in the hall.<br>Independent event giveaway. Not affiliated with Mercedes or Formula 1.<br>Includes a QR awareness activity. Prize illustration only.</p><span class="location">${source}</span>`;document.body.append(p)}</script></body></html>
